name: Studio
on:
  push:
    paths: ['studio/**', 'package.json', '.github/workflows/studio.yml', '.agents/skills/archify-standards/**', '.agents/skills/archify-studio-design/**', 'AGENTS.md']
  pull_request:
    paths: ['studio/**', 'package.json', '.github/workflows/studio.yml', '.agents/skills/archify-standards/**', '.agents/skills/archify-studio-design/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, node: 22, python: '3.11'}
          - {os: ubuntu-latest, node: 24, python: '3.14'}
          - {os: windows-latest, node: 22, python: '3.11'}
          - {os: windows-latest, node: 24, python: '3.14'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: npm run check:all
      - run: npm run build
      - name: Python packet to Studio roundtrip
        run: |
          python studio/tools/package_atlas.py --model studio/examples/atlas-model.json --source-root studio/examples --out .local/ci-packet
          node studio/build.mjs --atlas .local/ci-packet --out .local/ci-atlas.html
